[package]
name = "non-layered-tidy-trees"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Drawing non-layered tidy trees in linear time (van der Ploeg, 2014), a port of the C implementation"
repository = "https://github.com/massimo-nocentini/non-layered-tidy-trees-rs"
readme = "README.md"
keywords = ["tree", "layout", "drawing", "tidy"]
categories = ["algorithms", "visualization"]
documentation = "https://docs.rs/non-layered-tidy-trees"
# `docs/` is 3.5 MB of committed rustdoc, there for GitHub Pages and not for the crate.
exclude = ["docs/", ".github/"]

[dependencies]

[profile.test]
opt-level = 1
